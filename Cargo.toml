[package]
name = "noson"
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Generate random JSON values from a JSON Schema"
repository = "https://github.com/glennib/noson"
keywords = ["json-schema", "json", "generator", "testing", "fake-data"]
categories = ["development-tools::testing"]
readme = "README.md"

[dependencies]
jiff = "0.2"
rand = "0.10.0"
regex-syntax = "0.8"
serde_json = "1"
thiserror = "2"
uuid = "1.24.0"

[dev-dependencies]
jsonschema = "0.49.6"
regex = "1"
